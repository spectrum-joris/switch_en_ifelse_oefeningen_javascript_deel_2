<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oefening 2 — BMI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>BMI berekenen</h1>
  <form id="bmiForm">
    <label for="w">Gewicht (kg):</label>
    <input type="number" id="w" step="0.1">
    <label for="h">Lengte (m):</label>
    <input type="number" id="h" step="0.01">
    <button type="submit">Bereken</button>
  </form>
  <p id="res"></p>
  <script src="script.js"></script>
</body>
</html>
